[workspace]
members = [
    ".",
    "cli",
    "bindings/node"
]

[package]
name = "rtrace"
version = "0.3.0"
edition = "2021"
description = "A minimal Rust library with Node.js and WASM bindings"
license = "MIT"
repository = "https://github.com/SeaRyanC/rtrace"

[lib]
name = "rtrace"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
nalgebra = "0.33"
rayon = "1.8"
rand = "0.8"
clap = "4.5.53"

[profile.release]
opt-level = 3
lto = "thin"        # cross-crate inlining for hot-path functions
codegen-units = 1   # single codegen unit for maximum optimization

[[bin]]
name = "test_kdtree_consistency"
path = "tools/test_kdtree_consistency.rs"

[[bin]]
name = "debug_kdtree"
path = "tools/debug_kdtree.rs"

[[bin]]
name = "bench_render"
path = "tools/bench_render.rs"

[[bin]]
name = "bench_complex"
path = "tools/bench_complex.rs"
